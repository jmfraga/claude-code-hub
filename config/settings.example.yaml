# Copy this to settings.yaml and edit paths to match your machine.
# `~` is expanded automatically.

projects_root: ~/Projects
extra_projects: []          # Additional project paths outside projects_root
                             # e.g. [~/work/openclaw, ~/work/foo]

reports_path: ~/reportes     # Folder where you keep markdown reports
extra_reports_paths: []      # Additional report folders

# Optional. When set, the Sessions tab exposes an "↗ local" button next to
# each session that copies an `ssh -t <ssh_target> '<cmd>'` snippet to the
# clipboard so you can resume the session in your laptop's native terminal.
ssh_target: ""               # e.g. "you@host.tailscale-name" or "you@10.0.0.5"

# Whitelist of commands the hub can run on a project.
# IDs must be unique. cmd is an argv list (no shell).
allowed_commands:
  - { id: git_status,   label: "Git status",          cmd: ["git", "status", "--short"] }
  - { id: git_pull,     label: "Git pull",            cmd: ["git", "pull"] }
  - { id: npm_test,     label: "Run tests (npm)",     cmd: ["npm", "test"] }
  - { id: npm_install,  label: "Install deps (npm)",  cmd: ["npm", "install"] }
  - { id: pip_install,  label: "Install deps (pip)",  cmd: ["pip", "install", "-r", "requirements.txt"] }
